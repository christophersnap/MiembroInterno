<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cruz Verde Salvadoreña - Admin</title>
    <meta name="description" content="Sistema web para administrar el personal de Cruz Verde Salvadoreña, flota vehicular, solicitudes de combustible, solicitudes de compra y mantenimiento, cursos, certificaciones y seccionales." />
    <meta property="og:title" content="Cruz Verde Salvadoreña - Admin" />
    <meta property="og:description" content="Sistema web para administrar el personal de Cruz Verde Salvadoreña, flota vehicular, solicitudes de combustible, solicitudes de compra y mantenimiento, cursos, certificaciones y seccionales." />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .app-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #root:not(:empty) + .app-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e5e7eb;
        border-top-color: #008f39;
        border-radius: 50%;
        animation: cv-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes cv-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="app-loader">
      <div class="app-spinner"></div>
      <div style="color: #374151; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;">Cargando Cruz Verde Salvadoreña...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var isDevServer = window.location.port === '3000' || 
                          window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1';
        
        var caughtErrors = [];
        window.addEventListener('error', function(e) {
          caughtErrors.push(e.message || (e.target && e.target.src ? 'Error cargando ' + e.target.src : 'Error desconocido'));
        }, true);

        if (!isDevServer) {
          // Variables sincronizadas automáticamente durante el build
          var CURRENT_JS_BUNDLE = './assets/index-B4NuvVcB.js';
          var CURRENT_CSS_BUNDLE = './assets/index-D6Zwskc-.css';

          // Resolver ruta base para subcarpetas (ej: /miembros/)
          var subPath = (window.location.pathname.indexOf('/miembros') !== -1) ? '/miembros/assets/' : './assets/';
          var jsFilename = CURRENT_JS_BUNDLE.split('/').pop();
          var cssFilename = CURRENT_CSS_BUNDLE.split('/').pop();
          var resolvedJs = subPath + jsFilename;
          var resolvedCss = subPath + cssFilename;

          // Cargar CSS compilado de inmediato
          if (CURRENT_CSS_BUNDLE && !document.querySelector('link[href*="index-"]')) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = resolvedCss;
            document.head.appendChild(link);
          }

          // Cargar JS bundle de inmediato (sin esperar fetch ni timeout)
          if (CURRENT_JS_BUNDLE && !document.querySelector('script[src*="index-"]')) {
            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = resolvedJs;
            script.onerror = function() {
              caughtErrors.push('No se pudo descargar el archivo principal: ' + CURRENT_JS_BUNDLE);
            };
            document.body.appendChild(script);
          }

          // Diagnóstico de contingencia: Si después de 4.5s la app aún no ha montado
          setTimeout(function() {
            var loader = document.querySelector('.app-loader');
            if (loader && !document.getElementById('cv-diag-box')) {
              var box = document.createElement('div');
              box.id = 'cv-diag-box';
              box.style.marginTop = '24px';
              box.style.padding = '16px 20px';
              box.style.backgroundColor = '#ffffff';
              box.style.border = '1px solid #e2e8f0';
              box.style.borderRadius = '12px';
              box.style.boxShadow = '0 4px 12px rgba(0,0,0,0.06)';
              box.style.maxWidth = '380px';
              box.style.textAlign = 'center';
              box.style.fontSize = '13px';
              box.style.color = '#4b5563';

              var title = '<p style="margin:0 0 8px 0; font-weight:600; color:#1f2937;">¿El sistema está tardando en cargar?</p>';
              var errorDetails = '';
              if (caughtErrors.length > 0) {
                errorDetails = '<div style="margin:8px 0; padding:8px; background:#fef2f2; border:1px solid #fecaca; border-radius:6px; color:#b91c1c; font-size:11px; text-align:left; word-break:break-all;">' +
                  '<strong>Detalle detectado:</strong> ' + caughtErrors[0] + '</div>';
              }

              var actions = '<div style="display:flex; gap:8px; justify-content:center; margin-top:12px;">' +
                '<button onclick="window.location.href=\'/login\'" style="padding:6px 14px; background:#008f39; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:12px;">Ir al Acceso / Login</button>' +
                '<button onclick="if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});} window.location.reload(true);" style="padding:6px 14px; background:#f3f4f6; color:#374151; border:1px solid #d1d5db; border-radius:8px; font-weight:600; cursor:pointer; font-size:12px;">Limpiar Caché y Recargar</button>' +
                '</div>';

              box.innerHTML = title + errorDetails + actions;
              loader.appendChild(box);
            }
          }, 4500);
        }
      })();
    </script>
  </body>
</html>
