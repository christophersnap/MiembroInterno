name: Compilar y Desplegar en Hostinger

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'GUIA_HOSTINGER.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar proyecto con Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://jdulcedfnxfwjhfdxxsk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Fsj872ZIHQ3AmAwwT3tD8g_1mORaBhD' }}

      - name: Sincronizar carpeta assets en la raíz
        run: |
          mkdir -p assets
          cp -r dist/assets/* assets/
          echo "Assets sincronizados correctamente en la raíz:"
          ls -la assets/ | head -n 10

      - name: Verificar archivos compilados en dist
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error crítico: dist/index.html no fue generado por Vite"
            exit 1
          fi
          echo "Compilación exitosa. Archivos generados en dist/:"
          ls -la dist/

      - name: Guardar y subir compilación dist y assets al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/ assets/ .htaccess
          if git diff --staged --quiet; then
            echo "Las carpetas dist/ y assets/ ya están completamente actualizadas en el repositorio"
          else
            git commit -m "Auto-build: Actualizar dist/ y assets/ para Hostinger [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
