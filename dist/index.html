<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cruz Verde Salvadoreña - Admin</title>

    <meta property="og:title" content="Cruz Verde Salvadoreña - Admin" />
    <meta property="og:description" content="Sistema web para administrar el personal de Cruz Verde Salvadoreña, flota vehicular, solicitudes de combustible, solicitudes de compra y mantenimiento, cursos, certificaciones y seccionales." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;700&family=Outfit:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .app-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9fafb;
        position: fixed;
        inset: 0;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #root:not(:empty) + .app-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e5e7eb;
        border-top-color: #008f39;
        border-radius: 50%;
        animation: cv-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes cv-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/miembros/assets/index-DPPazk4G.js"></script>
    <link rel="stylesheet" crossorigin href="/miembros/assets/index-DWpVFUpQ.css">
  </head>
  <body>
    <div id="root"></div>
    <div class="app-loader">
      <div class="app-spinner"></div>
      <div style="color: #374151; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;">Cargando Cruz Verde Salvadoreña...</div>
    </div>
    <script>
      (function () {
        var host = window.location.hostname || '';
        if (host === 'localhost' || host === '127.0.0.1' || host.indexOf('.run.app') !== -1) {
          return;
        }
        var polling = null;
        var checking = false;
        function pollUntilReady() {
          var root = document.getElementById('root');
          if (root && root.childNodes.length > 0) {
            if (polling) clearInterval(polling);
            return;
          }
          if (checking) return;
          checking = true;
          var sep = window.location.search ? '&' : '?';
          var url = window.location.pathname + window.location.search + sep + '__cv_ready=1&_t=' + Date.now();
          fetch(url, { cache: 'no-store', headers: { 'X-CV-Ready-Check': '1' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
              var rootNow = document.getElementById('root');
              if (rootNow && rootNow.childNodes.length > 0) {
                if (polling) clearInterval(polling);
                return;
              }
              if (d && d.ready === true) {
                if (polling) clearInterval(polling);
                try {
                  var last = Number(sessionStorage.getItem('cv_boot_reload_ts') || '0');
                  if (Date.now() - last > 8000) {
                    sessionStorage.setItem('cv_boot_reload_ts', String(Date.now()));
                    window.location.reload();
                    return;
                  }
                } catch (e) {
                  window.location.reload();
                  return;
                }
              }
              checking = false;
            })
            .catch(function () {
              checking = false;
            });
        }
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length === 0) {
            polling = setInterval(pollUntilReady, 2500);
            pollUntilReady();
          }
        }, 4500);
      })();
    </script>
  </body>
</html>
